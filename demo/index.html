<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CiDAO 展示モード</title>
<style>
  :root { --bg:#0b1220; --fg:#e8edf7; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  /* スマホ枠：論理サイズ 390x844 を画面高さに合わせて拡大縮小する */
  #phone { width:390px; height:844px; transform-origin:center center; position:relative;
    border-radius:48px; background:#000; outline:14px solid #111; box-shadow:0 0 0 17px #2a3347, 0 20px 60px rgba(0,0,0,.6); }
  /* 画面の論理幅はちょうど390px（実機と同じ）。PC用スクロールバーはJSで測った幅だけiframeを広げ、枠の外へ隠す */
  #clip { position:absolute; inset:0; overflow:hidden; border-radius:48px; }
  #phone iframe { width:100%; height:100%; border:0; background:#fff; display:block; }
  #phone::before { content:""; position:absolute; top:10px; left:50%; width:110px; height:24px;
    margin-left:-55px; background:#000; border-radius:14px; z-index:2; pointer-events:none; }
  body.pc #phone { width:100vw; height:100vh; border-radius:0; outline:0; box-shadow:none; transform:none !important; }
  body.pc #clip { border-radius:0; }
  body.pc #phone iframe { width:100%; }
  body.pc #phone::before { display:none; }
  #bar { position:fixed; top:10px; right:10px; z-index:10; display:flex; gap:6px;
    opacity:.25; transition:opacity .2s; }
  #bar:hover, #bar:focus-within { opacity:1; }
  #bar button { background:#1c2638; color:var(--fg); border:1px solid #33425e; border-radius:8px;
    padding:8px 12px; font-size:14px; cursor:pointer; }
  #bar button:hover { background:var(--accent); }
  #hint { position:fixed; bottom:8px; left:0; right:0; text-align:center; font-size:12px; opacity:.35; }
</style>
</head>
<body>
<div id="stage">
  <div id="phone"><div id="clip"><iframe id="frame" title="CiDAO" allow="geolocation; clipboard-write"></iframe></div></div>
</div>
<div id="bar">
  <button id="toggle" title="M キー">PC表示</button>
  <button id="home" title="H キー">最初へ</button>
  <button id="reload" title="R キー">再読込</button>
</div>
<div id="hint">M：スマホ/PC切替　H：最初へ　R：再読込　（URL に ?url=… で開始ページを指定可）</div>
<script>
(function () {
  var BASE = 'https://cidao.vercel.app/';
  var params = new URLSearchParams(location.search);
  var start = params.get('url') || BASE;
  // 開始URLは CiDAO 本体のものだけ許可（他サイトを映さない）
  if (start.indexOf(BASE) !== 0) start = BASE;
  var frame = document.getElementById('frame');
  var phone = document.getElementById('phone');
  var btn = document.getElementById('toggle');
  frame.src = start;

  function scrollbarW() {
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;top:-999px;width:100px;height:100px;overflow:scroll';
    document.body.appendChild(d);
    var w = d.offsetWidth - d.clientWidth;
    document.body.removeChild(d);
    return w;
  }
  var SB = scrollbarW();
  function fit() {
    frame.style.width = document.body.classList.contains('pc') ? '100%' : (390 + SB) + 'px';
    if (document.body.classList.contains('pc')) { phone.style.transform = ''; return; }
    var s = Math.min(window.innerHeight / (844 + 80), window.innerWidth / (390 + 80));
    phone.style.transform = 'scale(' + s + ')';
  }
  function setMode(pc) {
    document.body.classList.toggle('pc', pc);
    btn.textContent = pc ? 'スマホ表示' : 'PC表示';
    try { localStorage.setItem('cidao-demo-mode', pc ? 'pc' : 'phone'); } catch (e) {}
    fit();
  }
  function toggle() { setMode(!document.body.classList.contains('pc')); }
  function home() { frame.src = start; }
  function reload() { frame.src = frame.src; }

  var saved = null;
  try { saved = localStorage.getItem('cidao-demo-mode'); } catch (e) {}
  setMode(params.get('mode') === 'pc' || (!params.get('mode') && saved === 'pc'));

  btn.onclick = toggle;
  document.getElementById('home').onclick = home;
  document.getElementById('reload').onclick = reload;
  window.addEventListener('resize', fit);
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === 'm') toggle(); else if (k === 'h') home(); else if (k === 'r') reload();
  });
})();
</script>
</body>
</html>
