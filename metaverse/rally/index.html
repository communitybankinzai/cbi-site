<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#1f2a30">
<title>印西 文化財スタンプラリー（試作）｜Inzai Heritage Stamp Rally</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
<style>
  :root { --ink:#1f2a30; --sub:#5d6b73; --line:#e3ded4; --bg:#f5f3ee; --card:#fff; --gold:#d4a017; --got:#2a7f62; --warn:#b4561c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif; line-height:1.5; }
  body { display:flex; flex-direction:column; }
  header { background:var(--ink); color:#fff; padding:8px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; flex:1 1 auto; }
  header h1 small { display:block; font-size:11px; font-weight:normal; opacity:.8; }
  .hbtn { background:#35454d; color:#fff; border:0; border-radius:8px; padding:7px 10px; font-size:13px; }
  .hbtn.on { background:var(--got); }
  .prog { background:#fff; border-bottom:1px solid var(--line); padding:6px 12px; font-size:13px; display:flex; align-items:center; gap:10px; }
  .prog .bar { flex:1; height:8px; background:#e8e4db; border-radius:999px; overflow:hidden; }
  .prog .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--got)); transition:width .4s; }
  #map { flex:1; min-height:300px; }
  #list { flex:1; overflow:auto; display:none; padding:8px 12px 80px; }
  body.listMode #map { display:none; } body.listMode #list { display:block; }
  #list button { width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:6px; font:inherit; color:inherit; display:flex; gap:10px; align-items:center; }
  #list .dot { width:14px; height:14px; border-radius:50%; background:var(--gold); flex:none; box-shadow:0 0 0 3px rgba(212,160,23,.25); }
  #list .dot.got { background:var(--got); box-shadow:none; }
  #list .nm { flex:1; font-size:15px; }
  #list .ds { font-size:12px; color:var(--sub); white-space:nowrap; }
  /* ピン */
  .rPin { position:relative; width:26px; height:26px; }
  .rPin .core { position:absolute; inset:4px; border-radius:50%; background:#c9a227; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .rPin .ring { position:absolute; inset:-4px; border-radius:50%; border:3px solid rgba(255,200,40,.85); animation:rPulse 1.6s ease-out infinite; }
  @keyframes rPulse { 0% { transform:scale(.7); opacity:.9; } 100% { transform:scale(1.8); opacity:0; } }
  .rPin.got .ring { display:none; }
  .rPin.got .core { background:#fff url() center/80% no-repeat; border-color:var(--got); box-shadow:0 0 0 2px var(--got); }
  .rPin.sel .core { outline:3px solid #1f6fd6; outline-offset:1px; }
  .me { width:16px; height:16px; border-radius:50%; background:#1f6fd6; border:3px solid #fff; box-shadow:0 0 0 2px #1f6fd6; }
  /* 下のカード */
  .sheet { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-radius:18px 18px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.18); padding:12px 16px calc(16px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .25s; z-index:1000; max-height:72vh; overflow:auto; }
  .sheet.show { transform:none; }
  .sheet .grip { width:40px; height:4px; background:#ccc; border-radius:2px; margin:0 auto 8px; }
  .sheet h2 { font-size:18px; margin:0; }
  .sheet .en { color:var(--got); font-size:14px; }
  .sheet .meta { font-size:12px; color:var(--sub); margin:2px 0 8px; }
  .sheet .row { display:flex; gap:10px; align-items:flex-start; }
  .sheet .row img { width:84px; height:84px; object-fit:contain; background:#eef3f1; border-radius:12px; flex:none; }
  .sheet p { font-size:14px; margin:0 0 6px; }
  .sheet .dist { font-size:14px; font-weight:600; }
  .sheet .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .sheet .acts button, .sheet .acts a { padding:12px 8px; border-radius:12px; border:1px solid var(--line); background:#fff; font-size:15px; text-align:center; color:var(--ink); text-decoration:none; font-family:inherit; }
  .sheet .acts .stamp { background:var(--gold); color:#1f2a30; border-color:var(--gold); font-weight:700; grid-column:1 / -1; }
  .sheet .acts .stamp:disabled { background:#eee; color:#888; border-color:#ddd; font-weight:normal; }
  .sheet .acts .stamp.got { background:var(--got); color:#fff; border-color:var(--got); }
  .sheet .close { position:absolute; right:10px; top:8px; background:none; border:0; font-size:22px; color:var(--sub); }
  .toast { position:fixed; left:50%; top:calc(92px + env(safe-area-inset-top)); transform:translateX(-50%); background:rgba(31,42,48,.92); color:#fff; padding:8px 14px; border-radius:999px; font-size:13px; z-index:1200; display:none; max-width:92vw; }
  .toast.show { display:block; }
  /* ゲット演出 */
  .pop { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:1300; padding:16px; }
  .pop.show { display:flex; }
  .pop .box { background:#fff; border-radius:18px; padding:18px; text-align:center; max-width:360px; width:100%; }
  .pop img { width:200px; height:200px; object-fit:contain; animation:popIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes popIn { from { transform:scale(.3) rotate(-10deg); opacity:0; } to { transform:none; opacity:1; } }
  .pop h3 { margin:8px 0 2px; font-size:20px; }
  .pop .sp { color:var(--sub); font-size:13px; }
  .pop button { margin-top:12px; padding:12px 24px; border-radius:12px; border:0; background:var(--got); color:#fff; font-size:16px; }
  /* スタンプ帳 */
  .book { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; z-index:1250; }
  .book.show { display:flex; }
  .book .box { background:#fff; width:100%; border-radius:18px 18px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); max-height:85vh; overflow:auto; }
  .book h2 { font-size:17px; margin:0 0 6px; }
  .book p { font-size:13px; color:var(--sub); margin:0 0 8px; }
  .book .code { font-family:ui-monospace,Consolas,monospace; font-size:24px; letter-spacing:2px; background:#f3f1ea; border-radius:10px; padding:8px 12px; text-align:center; }
  .book .qr { display:flex; justify-content:center; margin:8px 0; }
  .book .qr canvas, .book .qr img { width:160px; height:160px; background:#fff; padding:6px; border:1px solid var(--line); border-radius:10px; }
  .book .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .book .acts button { padding:12px 8px; border-radius:12px; border:1px solid var(--line); background:#fff; font-size:14px; font-family:inherit; }
  .book .acts .pri { background:var(--got); color:#fff; border-color:var(--got); }
  .book input { width:100%; padding:10px; font-size:18px; letter-spacing:2px; text-transform:uppercase; border:1px solid var(--line); border-radius:10px; font-family:ui-monospace,Consolas,monospace; }
  .book .st { font-size:13px; min-height:1.3em; margin-top:6px; }
  .book .st.err { color:var(--warn); }
  .leaflet-control-attribution { font-size:10px; }
  /* ガイドのツアーに参加中の帯 */
  .tourBar { background:#1f6fd6; color:#fff; font-size:13px; padding:6px 12px; display:none; align-items:center; gap:8px; }
  .tourBar.show { display:flex; }
  .tourBar b { flex:1; font-weight:600; }
  .tourBar button { background:rgba(255,255,255,.22); border:0; color:#fff; border-radius:8px; padding:5px 10px; font-size:12px; }
  .sheet .acts .listen { background:#eef3f1; }
  .tourBar .voice { background:rgba(255,255,255,.22); }
  .tourBar .voice.on { background:#2a7f62; }
  .capBar { background:#102a4c; color:#fff; font-size:15px; line-height:1.45; padding:8px 12px; display:none; max-height:7em; overflow:auto; }
  .capBar.show { display:block; }
  .capBar .ja { font-size:12px; opacity:.75; display:block; }
  .capBar .hint { font-size:12px; opacity:.8; }
  /* 質問の下書き（認識した文を直してから送る） */
  .askDraft { background:#1f2a30; color:#fff; font-size:14px; padding:8px 12px; display:none; }
  .askDraft.show { display:block; }
  .askDraft .adLabel { font-size:12px; opacity:.8; margin-bottom:4px; }
  .askDraft textarea { width:100%; box-sizing:border-box; background:#fff; color:#222; border:0; border-radius:8px; padding:8px; font-size:16px; font-family:inherit; resize:vertical; }
  .askDraft .adTr { margin:6px 0; padding:6px 8px; background:rgba(255,255,255,.12); border-radius:8px; font-size:14px; line-height:1.4; min-height:1.4em; word-break:break-word; }
  .askDraft .adActs { display:flex; flex-wrap:wrap; gap:8px; }
  .askDraft .adActs button { background:rgba(255,255,255,.22); border:0; color:#fff; border-radius:8px; padding:7px 12px; font-size:13px; font-family:inherit; }
  .askDraft .adActs button.pri { background:#2a7f62; }
  .askDraft .adActs button:disabled { opacity:.4; }
</style>
</head>

<header>
  <h1 id="ttl">🏛 文化財スタンプラリー <small id="sub">近くに行くとスタンプ（精霊カード）がもらえます・試作</small></h1>
  <button class="hbtn" id="langBtn" type="button">English</button>

</header>

<div class="capBar" id="capBar"></div>

  <div class="adTr" id="adTr"></div>
  <div class="adActs"><button type="button" class="pri" id="adSend" disabled>📨 ガイドに送る</button><button type="button" id="adRetrans">訳し直す</button><button type="button" id="adCancel">取り消す</button></div>
</div>
<div id="map" role="application" aria-label="文化財の地図"></div>
<div id="list"></div>

<div class="sheet" id="sheet">
  <div class="grip"></div>
  <button class="close" id="sheetClose" type="button" aria-label="閉じる">×</button>
  <h2 id="sName"></h2>
  <div class="en" id="sEn"></div>
  <div class="meta" id="sMeta"></div>
  <div class="row"><img id="sImg" alt=""><div><p id="sText"></p><div class="dist" id="sDist"></div></div></div>
  <div class="acts">
    <button type="button" class="stamp" id="stampBtn">✅ スタンプを押す</button>
    <a id="sGuide" target="_blank" rel="noopener">📖 くわしく</a>
    <a id="sCity" target="_blank" rel="noopener">🏛 市の解説</a>
    <button type="button" class="listen" id="listenBtn" style="display:none">🔊 聞く（英語）</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="pop" id="pop"><div class="box"><img id="popImg" alt=""><h3 id="popTtl"></h3><div class="sp" id="popSp"></div><button type="button" id="popOk">OK</button></div></div>

<div class="book" id="book"><div class="box">
  <h2 id="bTtl">📒 スタンプ帳</h2>
  <p id="bNote">スタンプはこの端末に保存されます。「コードを発行」すると、別の端末や次の来訪でも、コードを入れれば続きから集められます（名前や連絡先は保存しません）。</p>

  <div class="qr" id="bQr"></div>
  <div class="acts">
    <button type="button" class="pri" id="bIssue">コードを発行して保存</button>
    <button type="button" id="bCopy">リンクをコピー</button>
  </div>
  <p style="margin-top:12px" id="bResumeNote">別の端末・前回のコードで続きから：</p>
  <input id="bInput" maxlength="12" placeholder="例 7K3M-Q9ZT" autocapitalize="characters" autocomplete="off">
  <div class="acts"><button type="button" id="bResume">このコードで続きから</button><button type="button" id="bClose">閉じる</button></div>
  <div class="st" id="bSt"></div>
</div></div>

  function refreshPin(s) { if (markers[s.reportId]) markers[s.reportId].setIcon(icon(s)); }
  function refreshProgress() {
    var n = count(); $("cnt").textContent = n + " / " + SPOTS.length; $("bar").style.width = (SPOTS.length ? (100 * n / SPOTS.length) : 0) + "%";
  }

  function spotName(s) { var e = EN[s.reportId]; return lang === "en" && e ? e.name : s.name; }
  function renderList() {
    var el = $("list"); el.innerHTML = "";
    var list = SPOTS.slice();
    if (pos) list.sort(function (a, b) { return distM(pos, a) - distM(pos, b); });
    list.forEach(function (s) {
      var b = document.createElement("button"); b.type = "button";
      var got = !!store.stamps[s.reportId];
      b.innerHTML = '<span class="dot' + (got ? " got" : "") + '"></span><span class="nm">' + esc(spotName(s)) + (lang === "en" && EN[s.reportId] ? "" : "") + '</span>' +
        '<span class="ds">' + (pos ? esc(fmtD(distM(pos, s))) : esc(s.designation || "")) + '</span>';
      b.addEventListener("click", function () { document.body.classList.remove("listMode"); $("viewBtn").textContent = t("list"); map.invalidateSize(); openSheet(s.reportId, true); });
      el.appendChild(b);
    });
  }

  function openSheet(id, pan) {
    var s = SPOTS.filter(function (x) { return x.reportId === id; })[0]; if (!s) return;
    var prev = current; current = s; if (prev) refreshPin(prev); refreshPin(s);
    var e = EN[id], got = store.stamps[id];
    $("sName").textContent = s.name; $("sEn").textContent = e ? e.name : (lang === "en" ? "" : "");
    $("sMeta").textContent = [s.designation, s.type, s.address ? "印西市" + s.address : ""].filter(Boolean).join("・") + (got ? "　✅ " + new Date(got.at).toLocaleDateString() : "");
    $("sImg").src = "../" + (s.cardImage || s.photo || ""); $("sImg").alt = s.spiritName || s.name;
    $("sText").textContent = lang === "en" ? (e ? e.intro : "") : (s.description || "");
    $("sGuide").href = "../guide/?spot=" + encodeURIComponent(id) + (lang === "en" ? "&lang=en" : "");
    $("sCity").href = s.detailUrl || "#";

    updateDist();
    $("sheet").classList.add("show");
    if (pan && map) map.panTo([s.lat, s.lon]);
  }
  function closeSheet() { $("sheet").classList.remove("show"); var p = current; current = null; if (p) refreshPin(p); }

  function canStamp(s) {
    if (!pos) return false;
    if (Date.now() - pos.t > STALE_MS) return false;   // 古い位置では押せない
    var d = distM(pos, s), tol = Math.min(pos.acc || 0, 40);   // 精度が悪いときは最大40mだけ甘くする
    return d <= RADIUS_M + tol;
  }
  function updateDist() {
    if (!current) return;
    var btn = $("stampBtn"), got = store.stamps[current.reportId];
    if (got) { btn.textContent = t("stamped"); btn.className = "stamp got"; btn.disabled = true; $("sDist").textContent = pos ? fmtD(distM(pos, current)) : ""; return; }
    btn.className = "stamp";
    if (!pos) { btn.disabled = true; btn.textContent = t("stamp"); $("sDist").textContent = t("noPos"); return; }
    var d = distM(pos, current);
    if (canStamp(current)) { btn.disabled = false; btn.textContent = t("stamp"); $("sDist").textContent = t("here") + "（" + fmtD(d) + "）"; }
    else { btn.disabled = true; btn.textContent = t("stamp"); $("sDist").textContent = t("far", { d: fmtD(Math.max(0, d - RADIUS_M)) }); }
  }

  function doStamp() {
    if (!current || store.stamps[current.reportId]) return;
    if (pos && Date.now() - pos.t > STALE_MS && navigator.geolocation && !params.get("fakepos")) {
      // 立ち止まっていると位置の更新が来ない端末があるので、押したときに1回だけ取り直してから判定する
      navigator.geolocation.getCurrentPosition(function (p) { onPos(p); if (canStamp(current)) doStamp(); else updateDist(); }, function () { updateDist(); }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
      return;
    }
    if (!canStamp(current)) return;
    var s = current;
    store.stamps[s.reportId] = { at: new Date().toISOString(), lat: pos ? Math.round(pos.lat * 1e4) / 1e4 : null, lon: pos ? Math.round(pos.lon * 1e4) / 1e4 : null };
    store.dirty = true; save(); refreshPin(s); refreshProgress(); updateDist(); renderList();
    $("popImg").src = "../" + (s.cardImage || s.photo || ""); $("popTtl").textContent = t("got"); $("popSp").textContent = (s.spiritName ? s.spiritName + "・" : "") + spotName(s);
    $("pop").classList.add("show");
    try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
    if (count() === SPOTS.length) setTimeout(function () { toast(t("all"), 5000); }, 800);
    sync();
  }

  /* ---- 現在地 ---- */
  function onPos(p) {
    pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy || 0, t: Date.now() };
    if (!meMarker) {
      meMarker = L.marker([pos.lat, pos.lon], { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 1000 }).addTo(map);
      meCircle = L.circle([pos.lat, pos.lon], { radius: pos.acc, color: "#1f6fd6", weight: 1, fillOpacity: .08 }).addTo(map);
      if (!params.get("spot")) map.setView([pos.lat, pos.lon], Math.max(map.getZoom(), 15));
    } else { meMarker.setLatLng([pos.lat, pos.lon]); meCircle.setLatLng([pos.lat, pos.lon]); meCircle.setRadius(pos.acc); }
    updateDist();
    // 近くの未訪問の文化財を1回だけ知らせる
    SPOTS.forEach(function (s) {
      if (store.stamps[s.reportId] || nearShownFor[s.reportId]) return;
      if (canStamp(s)) { nearShownFor[s.reportId] = true; toast(t("near", { n: spotName(s) }), 4000); if (!current) openSheet(s.reportId, false); }
    });
    if (document.body.classList.contains("listMode")) renderList();
  }
  function startWatch() {
    // 動作確認用（localhost だけ）：?fakepos=緯度,経度 で現在地を差し替える。本番の URL では無視する
    var fake = params.get("fakepos");
    if (fake && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      var fp = fake.split(",").map(parseFloat);
      if (fp.length === 2 && isFinite(fp[0]) && isFinite(fp[1])) { watchId = -1; onPos({ coords: { latitude: fp[0], longitude: fp[1], accuracy: 15 } }); return; }
    }
    if (!navigator.geolocation) { toast(t("posErr"), 4000); return; }
    if (watchId != null) return;
    watchId = navigator.geolocation.watchPosition(onPos, function () { watchId = null; toast(t("posErr"), 4000); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  }

  /* ---- スタンプ帳コード（CiDAO の API に保存・個人情報なし） ---- */
  function resumeUrl() { return location.origin + location.pathname + "?book=" + encodeURIComponent(store.code || "") + (lang === "en" ? "&lang=en" : ""); }
  function renderBook() {
    $("bCode").textContent = store.code || "—";
    var q = $("bQr"); q.innerHTML = "";
    if (store.code && window.qrcode) { try { var qr = qrcode(0, "M"); qr.addData(resumeUrl()); qr.make(); q.innerHTML = qr.createImgTag(4, 8); q.firstChild.alt = "QR"; } catch (e) {} }
    $("bIssue").style.display = store.code ? "none" : ""; $("bCopy").style.display = store.code ? "" : "none";
  }
  function mergeStamps(remote) {
    var n = 0; Object.keys(remote || {}).forEach(function (k) { if (!store.stamps[k]) { store.stamps[k] = remote[k]; n++; } });
    return n;
  }
  var syncGen = 0;   // 保存の世代番号（送信中に新しいスタンプが増えたら、古い応答で dirty を解除しない）
  function sync(cb) {
    // コードが無い＝まだ発行していない。端末保存だけで終える（発行は利用者がボタンで選ぶ）
    if (!store.code) { if (cb) cb(false); return; }
    var gen = ++syncGen;
    fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: store.code, stamps: store.stamps }) })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)); })
      .then(function (d) { if (d && d.stamps) mergeStamps(d.stamps); if (gen === syncGen) store.dirty = false; save(); refreshProgress(); SPOTS.forEach(refreshPin); if (cb) cb(true); })
      .catch(function () { if (cb) cb(false); });
  }
  function issueCode() {
    $("bSt").className = "st"; $("bSt").textContent = "…";
    fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ stamps: store.stamps }) })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)); })
      .then(function (d) { if (!d || !d.code) throw new Error("no code"); store.code = d.code; store.dirty = false; save(); renderBook(); $("bSt").textContent = t("saved"); })
      .catch(function () { $("bSt").className = "st err"; $("bSt").textContent = t("saveErr"); });
  }
  function resumeCode(code) {
    code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length < 6) return;
    $("bSt").className = "st"; $("bSt").textContent = "…";
    fetch(API + "?code=" + encodeURIComponent(code)).then(function (r) { if (r.status === 404) throw new Error("notFound"); return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)); })
      .then(function (d) { var n = mergeStamps(d && d.stamps); store.code = d.code || code; save(); renderBook(); refreshProgress(); SPOTS.forEach(refreshPin); renderList(); if (current) updateDist();
        $("bSt").textContent = t("resumed", { n: n }); if (Object.keys(store.stamps).length) sync(); })
      .catch(function (e) { $("bSt").className = "st err"; $("bSt").textContent = e.message === "notFound" ? t("notFound") : t("saveErr"); });
  }

  /* ---- 読み上げ（英語・ブラウザ標準） ---- */
  function loadVoices() { try { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) { voices = []; } }
  function speakEn() {
    if (!current || !EN[current.reportId]) return;
    if (!window.speechSynthesis) { toast(t("noVoice"), 3000); return; }
    var en = EN[current.reportId];
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(en.speech || en.intro);
    u.lang = "en-US"; u.rate = 0.95;
    var v = voices.filter(function (x) { return /^en[-_](US|GB)/i.test(x.lang); })[0] || voices.filter(function (x) { return /^en/i.test(x.lang); })[0];
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }

  /* ---- ガイドの字幕（say）と質問（ask）。翻訳は CiDAO の中継 API（Gemini） ---- */
  function speakText(text, langCode) {
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = langCode || "en-US"; u.rate = 0.95;
    var v = voices.filter(function (x) { return /^en[-_](US|GB)/i.test(x.lang); })[0] || voices.filter(function (x) { return /^en/i.test(x.lang); })[0];
    if (v && /^en/.test(u.lang)) u.voice = v;
    speechSynthesis.speak(u);
  }
  function stopSpeech() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} }
  function showCaption(p) {
    var cap = $("capBar"); cap.innerHTML = "";
    if (p && p.stop === true) { stopSpeech(); cap.classList.remove("show"); return; }   // ガイドがツアーを終えた
    var en = String(p.en || "").trim(), ja = String(p.ja || "").trim();
    if (!en && !ja) return;
    var main = document.createElement("div"); main.textContent = lang === "en" ? (en || ja) : (ja || en); cap.appendChild(main);
    if (lang === "en" && ja && !p.read) { var sub = document.createElement("span"); sub.className = "ja"; sub.textContent = ja; cap.appendChild(sub); }
    if (!voiceOn && en) { var h = document.createElement("span"); h.className = "hint"; h.textContent = " " + t("capHint"); cap.appendChild(h); }
    cap.classList.add("show");
    if (voiceOn && en) speakText(en, "en-US");
  }
  function translateTo(text, from, to) {
    return fetch(TRANSLATE_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text, from: from, to: to }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d && d.error ? d.error : ("HTTP " + r.status)); return d.text; }); });
  }
  // 認識・入力した文を下書きパネルに出し、訳を取りに行く（送るのは adSend を押したとき）
  var adSeq = 0;   // 古い訳の返答で上書きしないための番号
  var adSrc = "";  // 今の訳の元にした原文（編集されたかの判定用）
  var askRecGen = 0;  // 録音の世代。✏️の入力・Cancel・退出で進め、古い録音の結果を捨てる
  var adHideGen = 0;  // 下書きを閉じた回数（送信中に閉じられたか判定する）
  function askDraftHide() { var d = $("askDraft"); d.hidden = true; d.classList.remove("show"); adSeq++; askRecGen++; adHideGen++; }
  function askTranslateDraft() {
    var text = $("adText").value.trim(), n = ++adSeq;
    adSrc = text;
    $("adSend").disabled = true;
    if (!text) { $("adTr").textContent = ""; return; }
    $("adTr").textContent = "…";
    translateTo(text, lang === "en" ? "en" : "ja", lang === "en" ? "ja" : "en").then(function (tr) {
      if (n !== adSeq) return;
      $("adTr").textContent = tr; $("adSend").disabled = !String(tr || "").trim();
    }).catch(function () { if (n !== adSeq) return; $("adTr").textContent = ""; toast(t("askErr"), 4000); });
  }
  function askShowDraft(text) {
    text = String(text || "").trim(); if (!text || !tour) return;
    askRecGen++;   // 手入力・認識結果の表示で、動いている録音の結果は古くなる
    var d = $("askDraft"); $("adText").value = text; d.hidden = false; d.classList.add("show");
    askTranslateDraft();
  }
  function askSendDraft() {
    var mine = $("adText").value.trim(), tr = $("adTr").textContent.trim();
    if (!mine || !tr || !tour) return;
    if (mine !== adSrc) { askTranslateDraft(); return; }   // 訳したあとに原文を直していたら、訳し直してから
    var ja = lang === "en" ? tr : mine, en = lang === "en" ? mine : tr;
    var spot = current ? current.reportId : null;
    var sentTour = tour, sentHide = adHideGen;   // 送信を始めた時点のツアーと下書きの世代
    $("adSend").disabled = true;
    // まず記録 API に保存（失敗しても送信は続ける）
    fetch("https://cidao.vercel.app/api/rally-log", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tour: tour.tourId, spot: spot, kind: "ask", ja: ja, en: en }) })
      .then(function (r) { return r.json().then(function (d) { return r.ok && d && d.id != null ? d.id : null; }); })
      .catch(function () { return null; })
      .then(function (id) {
        if (tour !== sentTour) { toast(t("askErr"), 4000); return; }   // 保存中に退出・再参加していたら別ツアーへは送らない
        if (sentHide !== adHideGen) return;   // 保存中に下書きを閉じていたら送らない
        tour.send("ask", { id: id, en: en, ja: ja, spot: spot, at: Date.now() });
        toast(t("askSent"), 3000); askDraftHide();
      });
  }
  function askToggle() {
    if (!tour) return;
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { var tx = prompt(t("askPrompt")); if (tx) askShowDraft(tx); return; }
    if (askRec) { try { askRec.stop(); } catch (e) {} return; }
    askRec = new SR(); askRec.lang = lang === "en" ? "en-US" : "ja-JP"; askRec.interimResults = false; askRec.continuous = false;
    var got = "", myGen = ++askRecGen;
    askRec.onresult = function (ev) { for (var i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) got += ev.results[i][0].transcript; };
    askRec.onerror = function () { toast(t("noMic"), 3000); };
    askRec.onend = function () { askRec = null; $("askBtn").textContent = t("ask"); if (myGen !== askRecGen) return; if (got.trim()) askShowDraft(got); };
    $("askBtn").textContent = "⏹"; toast(t("askListen"), 3000);
    try { askRec.start(); } catch (e) { askRec = null; $("askBtn").textContent = t("ask"); var tx2 = prompt(t("askPrompt")); if (tx2) askShowDraft(tx2); }
  }

  /* ---- ガイドのツアーに参加（ガイドが選んだ文化財に画面を合わせる）。部品は ../guide/tour-sync.js ---- */
  function tourRenderBar() {
    var bar = $("tourBar");
    if (!tour) { bar.classList.remove("show"); return; }
    $("tourTxt").textContent = t("tourOn", { c: tour.tourId }); bar.classList.add("show");
  }
  var lastSpot = { id: null, at: 0 };   // ガイドの spot 配信の重複排除用
  function tourJoin(id) {
    if (!window.CbiTourSync) return;
    var code = CbiTourSync.normalize(id); if (!code) return;
    CbiTourSync.loadLib(function (ok) {
      if (!ok) { toast(t("tourErr"), 4000); return; }
      if (tour) tour.leave();
      tour = CbiTourSync.connect({ tourId: code, role: "tourist",
        onSpot: function (p) {
          if (!p || !p.id || !markers[p.id]) return;
          if (p.at && p.at <= lastSpot.at) return;                       // 古い・同じ配信は無視
          if (p.at) lastSpot.at = p.at;
          if (p.id === lastSpot.id) return;                              // 同じ場所の再送・途中参加で画面を戻さない
          lastSpot.id = p.id;
          var sp = SPOTS.filter(function (x) { return x.reportId === p.id; })[0];
          document.body.classList.remove("listMode"); $("viewBtn").textContent = t("list"); map.invalidateSize();
          openSheet(p.id, true);
          toast(t("tourSpot", { n: sp ? spotName(sp) : p.id }), 3500);
        },
        onSay: showCaption,
        onStatus: function (st) {
          if (st === "SUBSCRIBED") { tourRenderBar(); try { sessionStorage.setItem("cbi-tour-tourist", code); } catch (e) {} }
          else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT") { toast(t("tourErr"), 4000); }
        }
      });
      tourRenderBar();
    });
  }
  function tourLeave() {
    if (tour) tour.leave(); tour = null; stopSpeech(); lastSpot = { id: null, at: 0 };
    try { sessionStorage.removeItem("cbi-tour-tourist"); } catch (e) {}
    $("capBar").classList.remove("show"); askDraftHide(); tourRenderBar();
  }

  /* ---- 起動 ---- */
  function boot() {
    map = L.map("map", { zoomControl: false, attributionControl: true }).setView([35.832, 140.145], 12);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", { attribution: "地理院タイル", maxZoom: 18 }).addTo(map);
    Promise.all([
      fetch("../bunkazai.json?v=" + V).then(function (r) { if (!r.ok) throw new Error("bunkazai " + r.status); return r.json(); }),
      fetch("../guide/texts.en.json?v=" + V).then(function (r) { return r.ok ? r.json() : { spots: {} }; }).catch(function () { return { spots: {} }; })
    ]).then(function (res) {
      SPOTS = (res[0].spots || []).filter(function (s) { return isFinite(s.lat) && isFinite(s.lon) && s.reportId; });
      EN = (res[1] && res[1].spots) || {};
      SPOTS.forEach(function (s) {
        var m = L.marker([s.lat, s.lon], { icon: icon(s), title: s.name }).addTo(map);
        m.on("click", function () { openSheet(s.reportId, false); });
        markers[s.reportId] = m;
      });
      refreshProgress(); renderList(); renderBook(); applyLang();
      var book = params.get("book"); if (book) resumeCode(book);
      var sp = params.get("spot"); if (sp && markers[sp]) { map.setView([markers[sp].getLatLng().lat, markers[sp].getLatLng().lng], 16); openSheet(sp, false); }
      startWatch();
      if (store.dirty && store.code) sync();
      var tp = params.get("tour"); if (!tp) { try { tp = sessionStorage.getItem("cbi-tour-tourist"); } catch (e) {} }
      if (tp) tourJoin(tp);
    }).catch(function (e) { toast("データを読み込めませんでした: " + e.message, 6000); });
  }

  $("langBtn").addEventListener("click", function () { lang = lang === "ja" ? "en" : "ja"; try { history.replaceState(null, "", location.pathname + (lang === "en" ? "?lang=en" : "")); } catch (e) {} applyLang(); });
  $("viewBtn").addEventListener("click", function () { document.body.classList.toggle("listMode"); $("viewBtn").textContent = document.body.classList.contains("listMode") ? t("map") : t("list"); if (!document.body.classList.contains("listMode")) map.invalidateSize(); else renderList(); });
  $("meBtn").addEventListener("click", function () { if (pos) map.setView([pos.lat, pos.lon], Math.max(map.getZoom(), 16)); else { startWatch(); toast(t("noPos"), 3000); } });
  $("sheetClose").addEventListener("click", closeSheet);
  $("stampBtn").addEventListener("click", doStamp);
  $("popOk").addEventListener("click", function () { $("pop").classList.remove("show"); });
  $("bookBtn").addEventListener("click", function () { renderBook(); $("bSt").textContent = ""; $("book").classList.add("show"); });
  $("bClose").addEventListener("click", function () { $("book").classList.remove("show"); });
  $("book").addEventListener("click", function (ev) { if (ev.target === $("book")) $("book").classList.remove("show"); });
  $("bIssue").addEventListener("click", issueCode);
  $("bResume").addEventListener("click", function () { resumeCode($("bInput").value); });
  $("bCopy").addEventListener("click", function () {
    var u = resumeUrl();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(function () { $("bSt").className = "st"; $("bSt").textContent = t("copied"); }, function () { $("bSt").textContent = u; });
    else $("bSt").textContent = u;
  });
  $("listenBtn").addEventListener("click", speakEn);
  $("tourLeave").addEventListener("click", tourLeave);
  $("voiceBtn").addEventListener("click", function () {
    voiceOn = !voiceOn; $("voiceBtn").textContent = voiceOn ? t("voiceOn") : t("voiceOff"); $("voiceBtn").classList.toggle("on", voiceOn);
    if (!voiceOn) stopSpeech();
    if (voiceOn) { try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(lang === "en" ? "Voice on." : "音声をオンにしました"); u.lang = lang === "en" ? "en-US" : "ja-JP"; speechSynthesis.speak(u); } catch (e) {} } // 最初の操作で読み上げを許可させる
  });
  $("askBtn").addEventListener("click", askToggle);
  $("adSend").addEventListener("click", askSendDraft);
  $("adRetrans").addEventListener("click", askTranslateDraft);
  $("adCancel").addEventListener("click", askDraftHide);
  $("askTypeBtn").addEventListener("click", function () { if (!tour) return; var tx = prompt(t("askPrompt")); if (tx) askShowDraft(tx); });
  $("joinBtn").addEventListener("click", function () { var c = prompt(t("joinPrompt")); if (c) tourJoin(c); });
  loadVoices();
  if (window.speechSynthesis && typeof speechSynthesis.onvoiceschanged !== "undefined") speechSynthesis.onvoiceschanged = loadVoices;
  window.addEventListener("online", function () { if (store.dirty && store.code) sync(); });
  boot();
})();
</script>
</body>
</html>
