<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ひなまつりの ひみつを さがそう</title>
<style>
  :root {
    --ink: #4a2b33;
    --pink: #d6336c;
    --pink-soft: #ffe3ea;
    --gold: #b8860b;
    --ok: #2f9e44;
    --ng: #e8590c;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background: linear-gradient(#fff5f7, #ffe3ea 60%, #ffd6e0);
    background-attachment: fixed;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 18px;
    line-height: 2.1;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px 40px; }
  .top {
    position: sticky; top: 0; z-index: 5;
    margin: 0 -16px; padding: 6px 16px 10px;
    background: #fff5f7;
    border-radius: 0 0 18px 18px;
    box-shadow: 0 3px 8px rgba(214, 51, 108, .12);
  }
  .top h1 {
    margin: 0; text-align: center; font-size: 15px; line-height: 1.6;
    color: var(--pink); letter-spacing: .04em;
  }
  .stage { display: block; width: 100%; max-width: 270px; height: auto; margin: 0 auto; }
  .dots { display: flex; justify-content: center; gap: 8px; margin: 2px 0 0; padding: 0; list-style: none; }
  .dots li { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #f3a6bd; }
  .dots li.done { background: var(--pink); border-color: var(--pink); }
  .dots li.now { background: #ffd43b; border-color: #f08c00; }

  .card {
    margin-top: 10px; padding: 16px 16px 18px;
    background: #fff; border-radius: 18px;
    box-shadow: 0 4px 14px rgba(214, 51, 108, .15);
  }
  .card h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.6; color: var(--pink); }
  .card h2 small { display: block; font-size: 13px; color: #a8687b; font-weight: normal; }
  .card p { margin: 0 0 8px; }
  ruby { white-space: nowrap; }
  ruby rt { font-size: .5em; }

  .talk { display: flex; gap: 10px; align-items: flex-start; }
  .talk img {
    flex: 0 0 64px; width: 64px; height: 64px; object-fit: contain;
    background: #fff5f7; border-radius: 50%; border: 2px solid #f3a6bd;
  }
  .talk .bubble {
    flex: 1; min-width: 0; padding: 8px 12px; border-radius: 14px;
    background: #fff5f7; border: 2px solid #f8c6d4;
  }
  .talk .bubble p:last-child { margin-bottom: 0; }

  .q { font-weight: bold; font-size: 19px; line-height: 1.9; }
  .opts { display: grid; gap: 10px; margin: 10px 0 0; }
  button {
    font: inherit; color: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .opt {
    display: block; width: 100%; min-height: 56px; padding: 8px 14px;
    text-align: left; line-height: 1.9;
    background: #fff; border: 3px solid #f3a6bd; border-radius: 14px;
  }
  .opt:active { background: var(--pink-soft); }
  .opt[disabled] { cursor: default; opacity: .6; }
  .opt.right { opacity: 1; border-color: var(--ok); background: #ebfbee; }
  .opt.wrong { opacity: 1; border-color: var(--ng); background: #fff4e6; }
  .opt .mark { font-weight: bold; margin-right: 6px; }

  .go {
    display: block; width: 100%; min-height: 56px; margin-top: 14px; padding: 8px 14px;
    font-weight: bold; font-size: 19px; color: #fff;
    background: var(--pink); border: 0; border-radius: 28px;
    box-shadow: 0 4px 0 #a61e4d;
  }
  .go:active { transform: translateY(2px); box-shadow: 0 2px 0 #a61e4d; }
  .go.sub { color: var(--pink); background: #fff; border: 3px solid var(--pink); box-shadow: none; }
  a.go { text-align: center; text-decoration: none; line-height: 2.1; }

  .result { margin-top: 12px; padding: 10px 12px; border-radius: 14px; }
  .result.ok { background: #ebfbee; border: 2px solid #8ce99a; }
  .result.ng { background: #fff4e6; border: 2px solid #ffc078; }
  .result strong { font-size: 20px; }
  .card .got {
    margin: 10px 0 0; padding: 6px 12px; text-align: center; font-weight: bold;
    color: #7a5200; background: #fff3bf; border-radius: 14px;
  }

  .name { display: block; margin-top: 10px; }
  .name input {
    display: block; width: 100%; min-height: 48px; margin-top: 2px; padding: 4px 12px;
    font: inherit; border: 3px solid #f3a6bd; border-radius: 12px;
  }
  .cert { display: block; width: 100%; height: auto; margin-top: 12px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
  .note { font-size: 13px; line-height: 1.8; color: #7b5560; }
  .foot { margin-top: 22px; font-size: 12px; line-height: 1.8; color: #7b5560; }
  .foot a { color: inherit; }

  .pop { transform-box: fill-box; transform-origin: 50% 100%; animation: pop .7s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>ひなまつりの ひみつを さがそう</h1>
    <div id="stage"></div>
    <ol class="dots" id="dots" aria-hidden="true"></ol>
  </div>
  <main class="card" id="card" aria-live="polite"></main>
  <footer class="foot">
    <p>
      これは Community Bank Inzai（CBI）の ためしの ページです。なまえや こたえは、どこにも おくりません。<br>
      おはなしの もと：農林水産省「<a href="https://www.maff.go.jp/j/keikaku/syokubunka/oishiiwashoku/article/89/" target="_blank" rel="noopener">健やかな成長を願って～「ひな祭り」に子どもへ想いを伝えよう～</a>」、
      日本人形協会「<a href="https://www.ningyo-kyokai.or.jp/mamechishiki/sekku/jyoushi" target="_blank" rel="noopener">上巳 ～桃の節句とひな人形～</a>」「<a href="https://www.ningyo-kyokai.or.jp/jiten/history.html" target="_blank" rel="noopener">ひな祭りの歴史</a>」「<a href="https://www.ningyo-kyokai.or.jp/blog/1-3" target="_blank" rel="noopener">雛人形の飾り方</a>」。
      いいつたえには、ほかの せつも あります。<br>
      あんないやくの せいれい「ムサシヤ」の えは、AIで つくった えです。
    </p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  // 「{漢字|よみ}」をふりがな付きにする（文は全部このファイルに書いたものだけ）
  function r(text) {
    return text.replace(/\{([^|}]+)\|([^}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
  }
  function plain(text) {
    return text.replace(/\{([^|}]+)\|([^}]+)\}/g, "$1");
  }

  var GUIDE_IMG = "../metaverse/spirits/ムサシヤ.webp";

  var CHAPTERS = [
    {
      key: "bonbori", got: "ぼんぼり", title: "かみの にんぎょう",
      story: [
        "むかしの {人|ひと}は、3{月|がつ}の はじめに、{紙|かみ}や {草|くさ}で {人|ひと}の かたちを つくりました。",
        "それで からだを なでて、びょうきや わるいことを うつしたのです。この にんぎょうを「ひとがた」と いいます。"
      ],
      q: "わるいことを うつした「ひとがた」を、むかしの {人|ひと}は どうしたでしょう？",
      opts: [
        { t: "{川|かわ}や {海|うみ}に ながした", ok: true },
        { t: "たなの {上|うえ}に かざった" },
        { t: "{土|つち}の {中|なか}に うめた" }
      ],
      exp: "{川|かわ}や {海|うみ}に ながして、わるいことを おいはらいました。いまも「ながしびな」として のこっている ところが あります。"
    },
    {
      key: "ohina", got: "おひなさま", title: "ひいなあそび",
      story: [
        "1000{年|ねん}ほど まえの {平安時代|へいあんじだい}。みやこの {女|おんな}の{子|こ}たちは、{紙|かみ}で つくった {小|ちい}さな にんぎょうで あそんで いました。",
        "にんぎょうの おうちや どうぐも ある、いまの ままごとの ような あそびです。"
      ],
      q: "この にんぎょうあそびは、なんと よばれて いたでしょう？",
      opts: [
        { t: "ひいなあそび", ok: true },
        { t: "かるたあそび" },
        { t: "たこあげ" }
      ],
      exp: "「ひいな」は、{小|ちい}さな にんぎょうの ことです。『{源氏物語|げんじものがたり}』や『{枕草子|まくらのそうし}』という むかしの {本|ほん}にも {出|で}てきます。"
    },
    {
      key: "odairi", got: "おだいりさま", title: "ふたつが ひとつに",
      story: [
        "わるいことを うつす「ひとがた」と、あそびの「ひいな」。ふたつは ながい あいだに むすびついて、ひなにんぎょうに なりました。",
        "{江戸時代|えどじだい}に なると、いえに かざって おいわいを する ように なります。"
      ],
      q: "ひなにんぎょうには、どんな ねがいが こめられて いるでしょう？",
      opts: [
        { t: "{子|こ}どもが げんきに そだちますように", ok: true },
        { t: "かけっこが はやく なりますように" },
        { t: "あしたが {雨|あめ}に なりますように" }
      ],
      exp: "にんぎょうが {子|こ}どもの かわりに わるいことを ひきうけて、すこやかに そだちますように。そんな ねがいが こめられて います。"
    },
    {
      key: "nakama", got: "三人官女と 五人ばやし", title: "ひなだんの なかまたち",
      story: [
        "ひなだんには、おだいりさまと おひなさまの ほかにも なかまが います。",
        "2だんめは「{三人官女|さんにんかんじょ}」。ごてんで はたらく {女|おんな}の {人|ひと}たちです。3だんめには「{五人|ごにん}ばやし」が ならびます。"
      ],
      q: "「{五人|ごにん}ばやし」は、なにを する {人|ひと}たちでしょう？",
      opts: [
        { t: "うたや がっきで おんがくを する", ok: true },
        { t: "ごちそうを つくる" },
        { t: "{門|もん}の まえで みはりを する" }
      ],
      exp: "「{能|のう}」という おしばいの おんがくたいです。うた・ふえ・こつづみ・おおつづみ・たいこの 5{人|にん}が ならびます。"
    },
    {
      key: "momo", got: "ももの {花|はな}", title: "ももの せっく",
      story: [
        "ひなまつりは「ももの {節句|せっく}」とも よばれます。",
        "むかしの こよみの 3{月|がつ}3{日|か}は、いまの 4{月|がつ}の はじめごろ。ちょうど ももの {花|はな}が さく きせつでした。"
      ],
      q: "むかしの {人|ひと}は、ももに どんな {力|ちから}が あると かんがえたでしょう？",
      opts: [
        { t: "わるいものを おいはらう {力|ちから}", ok: true },
        { t: "{空|そら}を とべる ように なる {力|ちから}" },
        { t: "すぐに ねむく なる {力|ちから}" }
      ],
      exp: "ももには、わるいものを おいはらう {力|ちから}が あると しんじられて いました。だから、ひなまつりに ももの {花|はな}を かざります。"
    },
    {
      key: "hishi", got: "ひしもち", title: "ひしもちの {色|いろ}",
      story: [
        "ひなまつりの おかし「ひしもち」は、3つの {色|いろ}の おもちを かさねて つくります。",
        "{下|した}から じゅんに、「だいち」「ゆき」「ももの {花|はな}」を あらわすと いわれて います。"
      ],
      q: "ひしもちの {色|いろ}は、{下|した}から じゅんに どれでしょう？",
      opts: [
        { t: "みどり → {白|しろ} → もも{色|いろ}", ok: true },
        { t: "もも{色|いろ} → みどり → {白|しろ}" },
        { t: "{白|しろ} → もも{色|いろ} → みどり" }
      ],
      exp: "ゆきの {下|した}には みどりの めが {出|で}て、ゆきの {上|うえ}には ももの {花|はな}が さく。{春|はる}が きた よろこびと、{子|こ}どもの せいちょうを ねがう {気|き}もちが こめられて いると いわれて います。"
    }
  ];

  var state = { phase: "title", i: 0, score: 0, earned: [], fresh: null, order: [], picked: -1 };

  // ---------- ひなだんの絵（図形だけで描く） ----------
  function face() {
    return '<circle cx="0" cy="-44" r="11" fill="#ffe8d6"/>' +
      '<circle cx="-4" cy="-43" r="1.3" fill="#3b2a2a"/><circle cx="4" cy="-43" r="1.3" fill="#3b2a2a"/>' +
      '<circle cx="-7" cy="-39.5" r="2.2" fill="#ffb3c1" opacity=".8"/><circle cx="7" cy="-39.5" r="2.2" fill="#ffb3c1" opacity=".8"/>' +
      '<path d="M-2,-38.5 Q0,-36.8 2,-38.5" fill="none" stroke="#c2255c" stroke-width="1" stroke-linecap="round"/>';
  }
  function body(color) {
    return '<path d="M-22,0 Q-27,-22 -10,-34 L10,-34 Q27,-22 22,0 Z" fill="' + color + '"/>' +
      '<path d="M-8,-34 L0,-23 L8,-34 Z" fill="#fff"/>';
  }
  var HAIR_F = '<path d="M-13,-27 L-13,-45 a13,13 0 0 1 26,0 L13,-27 L8.5,-27 L8.5,-45 a8.5,8.5 0 0 0 -17,0 L-8.5,-27 Z" fill="#2b2024"/>';
  var HAIR_M = '<path d="M-11.5,-46 a11.5,11.5 0 0 1 23,0 Z" fill="#2b2024"/>';

  function doll(kind, n) {
    if (kind === "ohina") {
      return body("#e8537a") +
        '<path d="M-22,0 Q-24,-8 -21,-13 L21,-13 Q24,-8 22,0 Z" fill="#f783ac"/>' +
        '<path d="M-22,0 Q-23,-4 -22,-6 L22,-6 Q23,-4 22,0 Z" fill="#ffd43b"/>' +
        HAIR_F + face() +
        '<path d="M-7,-56 L-4,-63 L0,-57 L4,-63 L7,-56 Z" fill="#f5c542" stroke="#b8860b" stroke-width=".8"/>' +
        '<path d="M-9,-14 L9,-14 L5,-25 L-5,-25 Z" fill="#f5c542" stroke="#b8860b" stroke-width=".8"/>';
    }
    if (kind === "odairi") {
      return body("#4a3f9c") +
        '<path d="M-22,0 Q-23,-4 -22,-6 L22,-6 Q23,-4 22,0 Z" fill="#7048e8"/>' +
        HAIR_M + face() +
        '<rect x="-5" y="-62" width="10" height="8" rx="2" fill="#2b2024"/>' +
        '<path d="M2,-61 q7,-13 3,-25" fill="none" stroke="#2b2024" stroke-width="3" stroke-linecap="round"/>' +
        '<rect x="-2.5" y="-27" width="5" height="16" rx="1.5" fill="#f1e0b0" stroke="#a98c4b" stroke-width=".8"/>';
    }
    if (kind === "kanjo") {
      return body("#ffffff") +
        '<path d="M-22,0 Q-27,-22 -10,-34 L10,-34 Q27,-22 22,0 Z" fill="none" stroke="#e9c3cd" stroke-width="1"/>' +
        '<path d="M-22,0 Q-25,-11 -20,-19 L20,-19 Q25,-11 22,0 Z" fill="#d3273e"/>' +
        HAIR_F + face();
    }
    // 五人ばやし
    var colors = ["#3b8ea5", "#5a9e4b", "#e8890c", "#3b8ea5", "#5a9e4b"];
    var tool = n === 1
      ? '<path d="M-12,-20 L12,-24" stroke="#8a5a2b" stroke-width="2.6" stroke-linecap="round"/>'
      : n === 0
        ? '<path d="M-7,-14 L7,-14 L4,-24 L-4,-24 Z" fill="#fff8e1" stroke="#b8860b" stroke-width=".8"/>'
        : '<circle cx="0" cy="-17" r="6.5" fill="#f3c96b" stroke="#8a5a2b" stroke-width="1.6"/>';
    return body(colors[n]) + HAIR_M + '<circle cx="0" cy="-58" r="3.2" fill="#2b2024"/>' + face() + tool;
  }
  function bonbori() {
    return '<circle cx="0" cy="-34" r="19" fill="#ffe066" opacity=".35"/>' +
      '<ellipse cx="0" cy="-1" rx="9" ry="2.5" fill="#2b2024"/>' +
      '<rect x="-1.4" y="-22" width="2.8" height="21" fill="#2b2024"/>' +
      '<rect x="-10" y="-47" width="20" height="26" rx="8" fill="#fffbe6" stroke="#2b2024" stroke-width="1.6"/>' +
      '<circle cx="-4" cy="-38" r="2" fill="#f783ac"/><circle cx="4" cy="-31" r="2" fill="#f783ac"/><circle cx="3" cy="-41" r="1.4" fill="#f783ac"/>' +
      '<rect x="-6" y="-50" width="12" height="4" rx="1.5" fill="#2b2024"/>';
  }
  function blossom(x, y) {
    var s = "";
    for (var k = 0; k < 5; k++) {
      var a = (Math.PI * 2 * k) / 5 - Math.PI / 2;
      s += '<circle cx="' + (x + Math.cos(a) * 3.4).toFixed(1) + '" cy="' + (y + Math.sin(a) * 3.4).toFixed(1) + '" r="2.9" fill="#ff8fab"/>';
    }
    return s + '<circle cx="' + x + '" cy="' + y + '" r="1.6" fill="#ffd43b"/>';
  }
  function momo() {
    return '<path d="M-6,0 L6,0 L8,-12 Q0,-16 -8,-12 Z" fill="#fff" stroke="#4dabf7" stroke-width="1.4"/>' +
      '<path d="M0,-13 Q-2,-28 -8,-38 M0,-20 Q5,-30 9,-34 M-3,-27 Q-8,-28 -12,-26" fill="none" stroke="#7a4b2a" stroke-width="2" stroke-linecap="round"/>' +
      blossom(-8, -40) + blossom(9, -36) + blossom(-13, -27) + blossom(1, -29);
  }
  function hishi() {
    function layer(y, color) {
      return '<path d="M-15,' + y + ' L0,' + (y - 6) + ' L15,' + y + ' L15,' + (y + 4) + ' L0,' + (y + 10) + ' L-15,' + (y + 4) + ' Z" fill="' + color + '" stroke="#c9a2ae" stroke-width=".7"/>';
    }
    return '<path d="M-11,0 L11,0 L8,-6 L-8,-6 Z" fill="#d3273e"/>' +
      layer(-12, "#8fd18a") + layer(-17, "#ffffff") + layer(-22, "#ff9ebb");
  }

  var SLOTS = [
    { key: "bonbori", x: 97, y: 84, s: 0.9, draw: bonbori },
    { key: "bonbori", x: 263, y: 84, s: 0.9, draw: bonbori },
    { key: "odairi", x: 152, y: 84, s: 0.95, draw: function () { return doll("odairi"); } },
    { key: "ohina", x: 208, y: 84, s: 0.95, draw: function () { return doll("ohina"); } },
    { key: "nakama", x: 146, y: 140, s: 0.72, draw: function () { return doll("kanjo"); } },
    { key: "nakama", x: 180, y: 140, s: 0.72, draw: function () { return doll("kanjo"); } },
    { key: "nakama", x: 214, y: 140, s: 0.72, draw: function () { return doll("kanjo"); } },
    { key: "nakama", x: 76, y: 196, s: 0.72, draw: function () { return doll("hayashi", 4); } },
    { key: "nakama", x: 128, y: 196, s: 0.72, draw: function () { return doll("hayashi", 3); } },
    { key: "nakama", x: 180, y: 196, s: 0.72, draw: function () { return doll("hayashi", 2); } },
    { key: "nakama", x: 232, y: 196, s: 0.72, draw: function () { return doll("hayashi", 1); } },
    { key: "nakama", x: 284, y: 196, s: 0.72, draw: function () { return doll("hayashi", 0); } },
    { key: "momo", x: 62, y: 140, s: 0.95, draw: momo },
    { key: "momo", x: 298, y: 140, s: 0.95, draw: momo },
    { key: "hishi", x: 104, y: 140, s: 1.45, draw: hishi },
    { key: "hishi", x: 256, y: 140, s: 1.45, draw: hishi }
  ];

  function stageSVG(earned, fresh, forImage) {
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 256"' +
      (forImage ? ' width="1080" height="768"' : ' class="stage" role="img" aria-label="ひなだん"') + '>';
    // びょうぶ
    s += '<rect x="96" y="12" width="168" height="72" fill="#f4dc86" stroke="#c9a53b" stroke-width="2"/>';
    for (var f = 1; f < 6; f++) s += '<line x1="' + (96 + f * 28) + '" y1="12" x2="' + (96 + f * 28) + '" y2="84" stroke="#c9a53b" stroke-width="1"/>';
    // だん
    [[66, 84, 228], [38, 140, 284], [10, 196, 340]].forEach(function (t) {
      s += '<rect x="' + t[0] + '" y="' + t[1] + '" width="' + t[2] + '" height="60" fill="#c81e3a"/>' +
           '<rect x="' + t[0] + '" y="' + t[1] + '" width="' + t[2] + '" height="7" fill="#f0586e"/>';
    });
    SLOTS.forEach(function (slot) {
      var has = earned.indexOf(slot.key) >= 0;
      s += '<g transform="translate(' + slot.x + ',' + slot.y + ') scale(' + slot.s + ')">';
      if (has) {
        s += '<g' + (fresh === slot.key ? ' class="pop"' : '') + '>' + slot.draw() + '</g>';
      } else if (!forImage) {
        s += '<circle cx="0" cy="-20" r="13" fill="#fff" opacity=".28" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 3"/>' +
             '<text x="0" y="-14" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff" opacity=".85">？</text>';
      }
      s += '</g>';
    });
    return s + '</svg>';
  }

  // ---------- 画面 ----------
  var card = document.getElementById("card");
  var stageBox = document.getElementById("stage");
  var dots = document.getElementById("dots");

  function shuffle(n) {
    var a = [];
    for (var k = 0; k < n; k++) a.push(k);
    for (var j = n - 1; j > 0; j--) {
      var m = Math.floor(Math.random() * (j + 1));
      var t = a[j]; a[j] = a[m]; a[m] = t;
    }
    return a;
  }
  function talk(lines) {
    return '<div class="talk"><img src="' + GUIDE_IMG + '" alt="せいれいの ムサシヤ" width="64" height="64">' +
      '<div class="bubble">' + lines.map(function (l) { return "<p>" + r(l) + "</p>"; }).join("") + '</div></div>';
  }
  function drawTop() {
    stageBox.innerHTML = stageSVG(state.earned, state.fresh, false);
    var html = "";
    for (var k = 0; k < CHAPTERS.length; k++) {
      var cls = k < state.earned.length ? "done" : (state.phase !== "title" && state.phase !== "end" && k === state.i ? "now" : "");
      html += '<li class="' + cls + '"></li>';
    }
    dots.innerHTML = html;
  }
  function show(html) {
    card.innerHTML = html;
    drawTop();
    window.scrollTo(0, 0);
  }
  function on(id, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener("click", fn);
  }

  function showTitle() {
    state = { phase: "title", i: 0, score: 0, earned: [], fresh: null, order: [], picked: -1 };
    show(
      talk([
        "こんにちは。ぼくは、{武蔵屋|むさしや}の せいれい「ムサシヤ」。",
        "ひなまつりには、どんな ねがいが こめられて いるのかな。おはなしを よんで、クイズに こたえよう。",
        "1もん こたえる たびに、ひなだんに にんぎょうが ならぶよ。"
      ]) +
      '<button class="go" id="start">はじめる</button>' +
      '<p class="note">ぜんぶで 6もん。3〜4ふんで あそべます。まちがえても、おはなしは さきへ すすみます。</p>'
    );
    on("start", function () { state.i = 0; showStory(); });
  }

  function showStory() {
    state.phase = "story"; state.fresh = null;
    var c = CHAPTERS[state.i];
    show(
      '<h2><small>だい' + (state.i + 1) + 'わ</small>' + r(c.title) + '</h2>' +
      talk(c.story) +
      '<button class="go" id="toquiz">クイズに ちょうせん</button>'
    );
    on("toquiz", showQuiz);
  }

  function showQuiz() {
    state.phase = "quiz"; state.picked = -1;
    var c = CHAPTERS[state.i];
    state.order = shuffle(c.opts.length);
    var html = '<h2><small>だい' + (state.i + 1) + 'わの クイズ</small>' + r(c.title) + '</h2>' +
      '<p class="q">' + r(c.q) + '</p><div class="opts">';
    state.order.forEach(function (idx, pos) {
      html += '<button class="opt" data-pos="' + pos + '">' + r(c.opts[idx].t) + '</button>';
    });
    show(html + '</div><div id="after"></div>');
    Array.prototype.forEach.call(card.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () { answer(Number(b.getAttribute("data-pos"))); });
    });
  }

  function answer(pos) {
    if (state.phase !== "quiz") return;
    state.phase = "answer";
    var c = CHAPTERS[state.i];
    var ok = !!c.opts[state.order[pos]].ok;
    if (ok) state.score++;
    state.earned.push(c.key);
    state.fresh = c.key;
    Array.prototype.forEach.call(card.querySelectorAll(".opt"), function (b, k) {
      b.disabled = true;
      if (c.opts[state.order[k]].ok) {
        b.classList.add("right");
        b.insertAdjacentHTML("afterbegin", '<span class="mark">○</span>');
      } else if (k === pos) {
        b.classList.add("wrong");
        b.insertAdjacentHTML("afterbegin", '<span class="mark">×</span>');
      }
    });
    var last = state.i === CHAPTERS.length - 1;
    document.getElementById("after").innerHTML =
      '<div class="result ' + (ok ? "ok" : "ng") + '"><strong>' + (ok ? "せいかい！" : "おしい！") + '</strong>' +
      '<p>' + r(c.exp) + '</p></div>' +
      '<p class="got">ひなだんに 「' + r(c.got) + '」が ならんだよ</p>' +
      '<button class="go" id="next">' + r(last ? "ひなだんを {見|み}る" : "つぎの おはなしへ") + '</button>';
    drawTop();
    on("next", function () {
      if (last) showEnd(); else { state.i++; showStory(); }
    });
    var next = document.getElementById("next");
    if (next && next.scrollIntoView) next.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function rank() {
    return state.score === CHAPTERS.length ? "ひなまつり はかせ" : "ひなまつり たんけんたい";
  }

  function showEnd() {
    state.phase = "end"; state.fresh = null;
    var all = state.score === CHAPTERS.length;
    show(
      '<h2><small>おしまい</small>ひなだんが かんせい！</h2>' +
      '<p class="got">' + r("6もん{中|ちゅう} ") + state.score + 'もん せいかい</p>' +
      talk([
        all ? "ぜんぶ せいかい！ きみは「ひなまつり はかせ」だ。" : "さいごまで よく がんばったね。もういちど やると、ぜんぶ せいかい できるかも。",
        "ぼくの いえ「{岩井家住宅|いわいけじゅうたく}（{旧|きゅう} {武蔵屋|むさしや}）」は、{大正|たいしょう}3{年|ねん}（1914{年|ねん}）に たてられました。{国|くに}の「{登録有形文化財|とうろくゆうけいぶんかざい}」です。",
        "{印西|いんざい}には、こうした たいせつな「ぶんかざい」が 50も あるんだよ。"
      ]) +
      '<label class="name">なまえ（かかなくても いいよ）<input id="name" type="text" maxlength="12" autocomplete="off" placeholder="れい：はな"></label>' +
      '<button class="go" id="mkcert">にんていしょうを つくる</button>' +
      '<div id="certbox"></div>' +
      '<button class="go sub" id="again">もういちど あそぶ</button>' +
      '<a class="go sub" href="../bunkazai/">' + r("{印西|いんざい}の ぶんかざいを {見|み}てみる") + '</a>'
    );
    on("mkcert", makeCert);
    on("again", showTitle);
  }

  // ---------- にんていしょう（画像） ----------
  function loadImage(src) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { resolve(null); };
      img.src = src;
    });
  }
  function makeCert() {
    var name = (document.getElementById("name").value || "").trim().slice(0, 12);
    var box = document.getElementById("certbox");
    box.innerHTML = '<p class="note">つくっています…</p>';
    var svg = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(stageSVG(state.earned, null, true));
    Promise.all([loadImage(svg), loadImage(GUIDE_IMG)]).then(function (imgs) {
      var W = 1080, H = 1350;
      var cv = document.createElement("canvas");
      cv.width = W; cv.height = H;
      var g = cv.getContext("2d");
      var FONT = '"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif';
      var grad = g.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, "#fff5f7"); grad.addColorStop(1, "#ffc9d6");
      g.fillStyle = grad; g.fillRect(0, 0, W, H);
      g.fillStyle = "#ffffff"; g.fillRect(48, 48, W - 96, H - 96);
      g.strokeStyle = "#c9a53b"; g.lineWidth = 10; g.strokeRect(48, 48, W - 96, H - 96);
      g.lineWidth = 3; g.strokeRect(70, 70, W - 140, H - 140);
      g.textAlign = "center"; g.textBaseline = "alphabetic";
      g.fillStyle = "#b8860b"; g.font = "bold 72px " + FONT;
      g.fillText("にんていしょう", W / 2, 190);
      g.fillStyle = "#4a2b33"; g.font = "bold 54px " + FONT;
      g.fillText(name ? name + " さん" : "あなたは", W / 2, 290);
      g.fillStyle = "#d6336c"; g.font = "bold 88px " + FONT;
      g.fillText(rank(), W / 2, 410);
      g.fillStyle = "#4a2b33"; g.font = "44px " + FONT;
      g.fillText("6もん中 " + state.score + "もん せいかい", W / 2, 490);
      if (imgs[0]) g.drawImage(imgs[0], 135, 530, 810, 576);
      if (imgs[1]) g.drawImage(imgs[1], 96, 1090, 170, 170);
      var d = new Date();
      g.textAlign = "right"; g.font = "36px " + FONT; g.fillStyle = "#4a2b33";
      g.fillText("ひなまつりの ひみつを さがそう", W - 110, 1170);
      g.fillText(d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日", W - 110, 1228);
      var url;
      try { url = cv.toDataURL("image/png"); } catch (e) { url = ""; }
      if (!url) { box.innerHTML = '<p class="note">がぞうを つくれませんでした。</p>'; return; }
      box.innerHTML = '<img class="cert" id="certimg" alt="にんていしょう" src="' + url + '">' +
        '<a class="go" id="save" download="hinamatsuri-ninteisho.png" href="' + url + '">がぞうを ほぞんする</a>' +
        '<p class="note">ほぞん できない ときは、がぞうを ながおし して ください。なまえは この がめんの 中だけで つかい、どこにも おくりません。</p>';
      var el = document.getElementById("certimg");
      if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
  }

  showTitle();
})();
</script>
</body>
</html>
