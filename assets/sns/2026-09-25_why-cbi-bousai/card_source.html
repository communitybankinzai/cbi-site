<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic","Meiryo",sans-serif;background:#0f2a47;color:#fff;overflow:hidden}
.wrap{padding:60px 72px 0}
.kicker{display:inline-block;background:#e0533d;font-weight:700;font-size:32px;padding:8px 22px;border-radius:8px}
h1{font-size:82px;line-height:1.18;font-weight:800;margin-top:22px}
.lead{font-size:34px;line-height:1.5;margin-top:20px;color:#d6e4f3}
.facts{margin-top:32px;display:flex;flex-direction:column;gap:16px}
.fact{background:rgba(255,255,255,.08);border-left:10px solid #5fb4e6;border-radius:10px;padding:18px 30px}
.num{font-size:58px;font-weight:800;color:#ffd166;line-height:1.1}
.num small{font-size:34px;color:#fff;margin-left:6px}
.desc{font-size:31px;line-height:1.45;margin-top:8px}
.src{font-size:22px;color:#9fb6cf;margin-top:6px}
.foot{position:absolute;left:72px;right:72px;bottom:44px;font-size:30px;line-height:1.5;color:#d6e4f3;border-top:2px solid rgba(255,255,255,.25);padding-top:22px}
.foot b{color:#fff}
</style></head><body>
<div class="wrap">
  <span class="kicker">市民の方からのご質問に答えます</span>
  <h1>なぜCBIが<br>防災MAPを？</h1>
  <p class="lead">公式の地図には「想定」が載ります。<br>「実際に起きたこと」は、市民にしか記録できません。</p>
  <div class="facts">
    <div class="fact"><div class="num">約56<small>%</small></div><div class="desc">8月の千葉豪雨で、冠水の報告が<br>浸水の想定区域の外だった割合</div><div class="src">出典：ウェザーニュース（約2万件の分析）</div></div>
    <div class="fact"><div class="num">0<small>か所</small></div><div class="desc">印西市内にある気象庁の雨量観測点（アメダス）</div></div>
    <div class="fact"><div class="num">447<small>件</small></div><div class="desc">台風25号の4日間（9/20〜24）に市民が寄せた<br>「通れた／通れなかった」の記録</div></div>
  </div>
</div>
<div class="foot"><b>CiDAOに出された提案から生まれた地図です</b><br>あなたの「あったらいいな」も提案・投票できます｜CBI</div>
</body></html>
