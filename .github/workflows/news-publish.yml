name: 更新履歴の掲載

# GAS のメール返信承認から呼ばれる受け口。
# GAS が repository_dispatch（event_type: news-publish）を投げると、
# tools/add_news.js が news-data.json に1件追加してコミットする。
# 設定手順と GAS 側のコードは docs/news-publish-setup.md を参照。
#
# GAS は応答だけ失われて再送されることがあるため、add_news.js 側で
# 冪等にしてある（同じ id / 同じ日付+本文なら何もしない）。

on:
  repository_dispatch:
    types: [news-publish]
  workflow_dispatch:
    inputs:
      line:
        description: "1行まるごと（例: 2026-08-08 【お知らせ】 本文）※これを使う場合は date/text は空でよい"
        required: false
      date:
        description: "日付（例: 2026-08-08）"
        required: false
      tag:
        description: "表示タグ（例: お知らせ / 紹介 / 構想。省略時「お知らせ」）"
        required: false
      text:
        description: "本文（HTMLタグ不可・200字まで）"
        required: false
      link_href:
        description: "リンク先（任意。# / 相対パス / http(s)）"
        required: false
      link_label:
        description: "リンクの表示文字（任意）"
        required: false

permissions:
  contents: write

concurrency:
  group: news-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 受け取った値は env 経由でのみ渡す（run: に直接展開しない）
      # 2026-10-11: 以前は「コミット→rebase→push」で、他の自動更新（site/ への通常のpush等）と
      # news-data.json の変更がちょうど重なると rebase が内容コンフリクトになり、3回リトライしても
      # 自動解決できずに失敗していた（お知らせ1件が欠落する事故が実際に発生）。
      # add_news.js は冪等（同じ id、または同じ 日付+本文 が既にあれば何もしない）なので、
      # 「毎回 origin の最新を取り込んでから add_news.js をやり直す」方式にすれば、
      # そもそもコンフリクトという概念が発生しない（常に最新のファイルへ直接追記するだけ）。
      - name: Add news item and push (retry by redoing on origin's latest)
        env:
          NEWS_LINE: ${{ github.event.client_payload.line || inputs.line }}
          NEWS_DATE: ${{ github.event.client_payload.date || inputs.date }}
          NEWS_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          NEWS_TEXT: ${{ github.event.client_payload.text || inputs.text }}
          NEWS_ID: ${{ github.event.client_payload.id }}
          NEWS_LINK_HREF: ${{ github.event.client_payload.link_href || inputs.link_href }}
          NEWS_LINK_LABEL: ${{ github.event.client_payload.link_label || inputs.link_label }}
          NEWS_TEXT_AFTER: ${{ github.event.client_payload.text_after }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node tools/add_news.js
            if git diff --quiet -- news-data.json; then
              echo "変更なし（掲載済みのため）。"
              exit 0
            fi
            git add news-data.json
            git commit -m "auto: 更新履歴に1件掲載"
            if git push; then
              exit 0
            fi
            echo "push失敗。${i}回目の再試行へ"
            sleep $((RANDOM % 8 + 3))
          done
          echo "::error::5回試しても掲載できませんでした"
          exit 1
