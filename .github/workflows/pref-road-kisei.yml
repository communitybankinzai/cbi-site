name: 防災MAP 県の道路規制状況図を取り込む

# 千葉県「県管理道路の通行規制情報」のPDF（状況図）から、規制中の赤線を地図用の線に直す。
# 県のページから図が消えたら pref-road-kisei.json を「掲載なし」にして、地図からも消す。
# 中身は inzai-disaster-map/pipeline/build_pref_road_kisei.py（2026-09-25 導入）。
#
# 起動のしかたは3つ：
#   - CiDAO の30分ごとの見張り（pg_cron cidao_pref_road_kisei → POST /api/disaster/pref-road-kisei）が県ページを見て、
#     PDF のリンク・時点の文字が pref-road-kisei.json と違うときだけ repository_dispatch で呼ぶ（本命・遅れない）
#     実装は cidao src/lib/pref-road-kisei-watch.ts
#   - 定期実行（予備。GitHub が間引くので最長12時間ほど空く。disaster-shot.yml 参照）
#   - Actions 画面からの手動実行

on:
  repository_dispatch:
    types: [pref-road-kisei]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "前回と同じPDFでも作り直す"
        type: boolean
        default: false
      ocr_check:
        description: "県の最新の復旧見込みPDFを OCR で試し読みする（一覧は変えない・結果はログ）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pref-road-kisei
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 部品を入れる
        # 2026-10-08 追加：県の復旧見込みPDFが全ページ画像になったときの OCR 予備経路（inzai-disaster-map/pipeline/press_cards.py）。
        # rapidocr-onnxruntime は opencv-python（GUI 付き）を道連れに入れるので --no-deps で入れ、必要な部品だけ別に入れる（opencv は上の headless を使う）。
        # 版は手元で58枚の読み取りを検証した 1.4.4 に固定（Python 3.12 まで対応）。モデルは wheel に同梱で、ダウンロードも apt も不要
        run: |
          pip install --quiet pymupdf opencv-python-headless numpy requests
          pip install --quiet --no-deps rapidocr-onnxruntime==1.4.4
          pip install --quiet onnxruntime pyclipper shapely pyyaml pillow six tqdm

      - name: 県のページを確かめて線を作る
        run: python inzai-disaster-map/pipeline/build_pref_road_kisei.py ${{ inputs.force && '--force' || '' }}

      # 2026-10-02 追加：県の「被災箇所の状況と復旧見込み」56区間の解除を、同じ状況図（分割図3枚）の赤線で判定する
      # （inzai-disaster-map/pipeline/build_pref_recovery.py・事業主決定A）。失敗しても上の取り込みの結果は残す
      - name: 復旧見込みの56区間の解除を判定する
        run: python inzai-disaster-map/pipeline/build_pref_recovery.py ${{ inputs.force && '--force' || '' }} || echo "復旧見込みの判定に失敗（上の取り込みは有効）"

      - name: 変わっていればコミット
        run: |
          if git diff --quiet -- inzai-disaster-map/pref-road-kisei.json inzai-disaster-map/pref-recovery-outlook.json; then
            echo "変更なし"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inzai-disaster-map/pref-road-kisei.json inzai-disaster-map/pref-recovery-outlook.json
          git commit -m "防災MAP: 県の道路規制状況図・復旧見込みの解除判定を更新（自動）"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1

      # 2026-10-08 追加：OCR の予備経路（画像だけのPDF）が Actions の環境で動くかの試し読み。手動実行で ocr_check を ON にしたときだけ。
      # 県の最新の復旧見込みPDFを読んで、関門の判定（cards／active／cleared／reason）をログに出す。一覧は書かない（--apply なし）
      - name: OCR の試し読み（手動実行・一覧は変えない）
        if: ${{ inputs.ocr_check }}
        run: |
          cd inzai-disaster-map/pipeline
          URL=$(python -c "import build_pref_recovery as B; print(B.latest_press_pdf() or '')")
          echo "PDF: $URL"
          curl -sSL -A "cbi-site pref-recovery ocr-check (communitybankinzai@gmail.com)" -o /tmp/press.pdf "$URL"
          python -c "import fitz; d=fitz.open('/tmp/press.pdf'); print('pages', len(d), 'words/page', [len(p.get_text('words')) for p in d])"
          time python press_cards.py /tmp/press.pdf
