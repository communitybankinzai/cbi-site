name: 防災MAP 県の道路規制状況図を取り込む

# 千葉県「県管理道路の通行規制情報」のPDF（状況図）から、規制中の赤線を地図用の線に直す。
# 県のページから図が消えたら pref-road-kisei.json を「掲載なし」にして、地図からも消す。
# 中身は inzai-disaster-map/pipeline/build_pref_road_kisei.py（2026-09-25 導入）。
#
# 起動のしかたは3つ：
#   - CiDAO の30分ごとの見張り（pg_cron cidao_pref_road_kisei → POST /api/disaster/pref-road-kisei）が県ページを見て、
#     PDF のリンク・時点の文字が pref-road-kisei.json と違うときだけ repository_dispatch で呼ぶ（本命・遅れない）
#     実装は cidao src/lib/pref-road-kisei-watch.ts
#   - 定期実行（予備。GitHub が間引くので最長12時間ほど空く。disaster-shot.yml 参照）
#   - Actions 画面からの手動実行

on:
  repository_dispatch:
    types: [pref-road-kisei]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "前回と同じPDFでも作り直す"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pref-road-kisei
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 部品を入れる
        run: pip install --quiet pymupdf opencv-python-headless numpy requests

      - name: 県のページを確かめて線を作る
        run: python inzai-disaster-map/pipeline/build_pref_road_kisei.py ${{ inputs.force && '--force' || '' }}

      - name: 変わっていればコミット
        run: |
          if git diff --quiet -- inzai-disaster-map/pref-road-kisei.json; then
            echo "変更なし"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inzai-disaster-map/pref-road-kisei.json
          git commit -m "防災MAP: 県の道路規制状況図を更新（自動）"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
