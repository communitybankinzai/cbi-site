name: 防災MAP 県の道路規制状況図を取り込む

# 千葉県「県管理道路の通行規制情報」のPDF（状況図）から、規制中の赤線を地図用の線に直す。
# 県のページから図が消えたら pref-road-kisei.json を「掲載なし」にして、地図からも消す。
# 中身は inzai-disaster-map/pipeline/build_pref_road_kisei.py（2026-09-25 導入）。
#
# ⚠ GitHub Actions の定期実行は間引かれる（実測で1日7回・最長12.4時間の空白。disaster-shot.yml 参照）。
#   県の図の差し替え・掲載終了の反映は数時間遅れることがある。急ぐときは Actions 画面から手動で実行する。

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pref-road-kisei
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 部品を入れる
        run: pip install --quiet pymupdf opencv-python-headless numpy requests

      - name: 県のページを確かめて線を作る
        run: python inzai-disaster-map/pipeline/build_pref_road_kisei.py

      - name: 変わっていればコミット
        run: |
          if git diff --quiet -- inzai-disaster-map/pref-road-kisei.json; then
            echo "変更なし"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inzai-disaster-map/pref-road-kisei.json
          git commit -m "防災MAP: 県の道路規制状況図を更新（自動）"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
